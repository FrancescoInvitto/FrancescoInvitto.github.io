<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrattore Studenti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
      --card-bg: rgba(28, 37, 65, 0.75);
      --card-border: rgba(0, 180, 216, 0.25);
      --primary-blue: #0077b6;
      --accent-cyan: #00b4d8;
      --accent-glow: #90e0ef;
      --text-main: #f8f9fa;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .audio-toggle {
      position: absolute;
      right: 0;
      top: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .audio-toggle:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 5px;
    }

    main {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .class-selector-group {
      margin-bottom: 15px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      display: block;
      margin-bottom: 8px;
    }

    select, input, textarea {
      width: 100%;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(144, 224, 239, 0.3);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent-cyan);
    }

    .btn-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #0096c7;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.4);
    }

    .stats {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--card-border);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Slot Machine Frame */
    .slot-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .slot-window {
      width: 100%;
      height: 220px;
      background: #070a14;
      border: 3px solid var(--accent-cyan);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 25px rgba(0, 180, 216, 0.2);
    }

    .slot-window::before, .slot-window::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 2;
      pointer-events: none;
    }

    .slot-window::before {
      top: 0;
      background: linear-gradient(to bottom, #070a14 0%, rgba(7, 10, 20, 0) 100%);
    }

    .slot-window::after {
      bottom: 0;
      background: linear-gradient(to top, #070a14 0%, rgba(7, 10, 20, 0) 100%);
    }

    .slot-target-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 60px;
      transform: translateY(-50%);
      border-top: 2px solid rgba(144, 224, 239, 0.4);
      border-bottom: 2px solid rgba(144, 224, 239, 0.4);
      background: rgba(0, 180, 216, 0.1);
      z-index: 1;
      pointer-events: none;
    }

    .slot-reel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
    }

    .slot-item {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #e2e8f0;
      width: 100%;
      text-align: center;
      padding: 0 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spin-btn {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 180, 216, 0.4);
      transition: all 0.2s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 180, 216, 0.6);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modal Popups */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 10, 20, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: #1c2541;
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .winner-title {
      color: var(--accent-cyan);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--accent-cyan);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <button class="audio-toggle" id="audioToggleBtn">
      <span id="audioIcon">🔊</span> <span id="audioStatus">Audio On</span>
    </button>
    <h1>Estrattore Studenti</h1>
    <div class="subtitle">Strumento per l'estrazione casuale nelle lezioni</div>
  </header>

  <main>
    <!-- Pannello di Controllo -->
    <div class="panel">
      <div class="class-selector-group">
        <label for="classSelect">Classe Attiva</label>
        <select id="classSelect"></select>
      </div>

      <div class="btn-group-vertical">
        <button class="btn btn-secondary" id="btnManualInput">✏️ Inserisci / Modifica Nomi</button>
        <button class="btn btn-secondary" id="btnLoadFile">📁 Carica File .TXT</button>
        <input type="file" id="fileInput" accept=".txt" style="display: none;">
        <button class="btn btn-danger" id="btnResetAbsents">🔄 Ripristina Esclusi</button>
      </div>

      <div class="stats">
        <span>Studenti disponibili: <strong id="countAvailable">0</strong></span>
        <span>Estratti: <strong id="countDrawn">0</strong></span>
      </div>
    </div>

    <!-- Area Slot Machine -->
    <div class="panel slot-stage">
      <div class="slot-window">
        <div class="slot-target-line"></div>
        <div class="slot-reel" id="slotReel">
          <div class="slot-item">Pronto</div>
        </div>
      </div>
      <button class="spin-btn" id="spinBtn">AVVIA ESTRAZIONE (15s)</button>
    </div>
  </main>

  <footer>
    Sviluppato per la Didattica | <span id="teacherInfo">Prof. Invitto Francesco</span>
  </footer>

  <!-- Modal Esito Estrazione -->
  <div class="modal-overlay" id="winnerModal">
    <div class="modal-card">
      <div class="winner-title">Studente Estratto</div>
      <div class="winner-name" id="winnerNameDisplay">-</div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btnMarkAbsent">Segna Assente</button>
        <button class="btn" id="btnCloseModal">OK</button>
      </div>
    </div>
  </div>

  <!-- Modal Gestione Nomi -->
  <div class="modal-overlay" id="inputModal">
    <div class="modal-card" style="max-width: 500px;">
      <div class="winner-title" style="text-align: left;">Gestione Elenco Studenti</div>
      <div style="margin-bottom: 12px; text-align: left;">
        <label for="newClassName">Nome Classe</label>
        <input type="text" id="newClassName" placeholder="es. 3A Informatica">
      </div>
      <div style="margin-bottom: 15px; text-align: left;">
        <label for="rawNamesTextarea">Nomi (uno per riga)</label>
        <textarea id="rawNamesTextarea" rows="8" placeholder="Mario Rossi&#10;Luigi Verdi&#10;Anna Bianchi"></textarea>
      </div>
      <div class="modal-actions" style="justify-content: flex-end;">
        <button class="btn btn-secondary" id="btnCloseInputModal">Annulla</button>
        <button class="btn" id="btnSaveClass">Salva Classe</button>
      </div>
    </div>
  </div>

  <script>
    // --- GESTIONE STATO & DATI ---
    let classesData = JSON.parse(localStorage.getItem('teacher_classes')) || {
      "Classe Esempio": ["Mario Rossi", "Luigi Verdi", "Anna Bianchi", "Giuseppe Garibaldi", "Elena Cornaro", "Galileo Galilei"]
    };
    let currentClassName = localStorage.getItem('teacher_active_class') || Object.keys(classesData)[0];
    let availableStudents = [];
    let drawnStudents = [];
    let currentWinner = null;
    let isSpinning = false;
    let audioEnabled = true;

    // Web Audio API
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new AudioContext();
      }
    }

    function playTickSound() {
      if (!audioEnabled || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    }

    function playWinSound() {
      if (!audioEnabled || !audioCtx) return;
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.1 + 0.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.4);
      });
    }

    // --- ELEMENTI DOM ---
    const classSelect = document.getElementById('classSelect');
    const countAvailable = document.getElementById('countAvailable');
    const countDrawn = document.getElementById('countDrawn');
    const slotReel = document.getElementById('slotReel');
    const spinBtn = document.getElementById('spinBtn');
    const winnerModal = document.getElementById('winnerModal');
    const winnerNameDisplay = document.getElementById('winnerNameDisplay');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnMarkAbsent = document.getElementById('btnMarkAbsent');
    const inputModal = document.getElementById('inputModal');
    const btnManualInput = document.getElementById('btnManualInput');
    const btnCloseInputModal = document.getElementById('btnCloseInputModal');
    const btnSaveClass = document.getElementById('btnSaveClass');
    const newClassName = document.getElementById('newClassName');
    const rawNamesTextarea = document.getElementById('rawNamesTextarea');
    const btnLoadFile = document.getElementById('btnLoadFile');
    const fileInput = document.getElementById('fileInput');
    const btnResetAbsents = document.getElementById('btnResetAbsents');
    const audioToggleBtn = document.getElementById('audioToggleBtn');

    // --- INIZIALIZZAZIONE ---
    function init() {
      renderClassOptions();
      loadClassData(currentClassName);
    }

    function renderClassOptions() {
      classSelect.innerHTML = '';
      Object.keys(classesData).forEach(cName => {
        const opt = document.createElement('option');
        opt.value = cName;
        opt.textContent = cName;
        if (cName === currentClassName) opt.selected = true;
        classSelect.appendChild(opt);
      });
    }

    function loadClassData(className) {
      currentClassName = className;
      localStorage.setItem('teacher_active_class', className);
      availableStudents = [...(classesData[className] || [])];
      drawnStudents = [];
      updateStats();
      resetReelUI();
    }

    function updateStats() {
      countAvailable.textContent = availableStudents.length;
      countDrawn.textContent = drawnStudents.length;
      spinBtn.disabled = availableStudents.length === 0 || isSpinning;
    }

    function resetReelUI() {
      slotReel.style.transition = 'none';
      slotReel.style.transform = 'translateY(0px)';
      if (availableStudents.length > 0) {
        slotReel.innerHTML = `<div class="slot-item">${availableStudents[0]}</div>`;
      } else {
        slotReel.innerHTML = `<div class="slot-item">Nessuno studente</div>`;
      }
    }

    // --- SLOT MACHINE CON SEQUENZA UNICA (NO DUPLICATI IN SEQUENZA) ---
    function startSpin() {
      if (availableStudents.length === 0 || isSpinning) return;
      initAudio();
      isSpinning = true;
      spinBtn.disabled = true;

      // Scegli lo studente vincente
      const winnerIndex = Math.floor(Math.random() * availableStudents.length);
      currentWinner = availableStudents[winnerIndex];

      // Costruisci una sequenza di scorrimento senza duplicati adiacenti
      const itemHeight = 60;
      const totalTicks = 80; // numero di elementi che scorreranno nei 15s
      const reelSequence = [];

      let lastStudent = "";
      for (let i = 0; i < totalTicks - 1; i++) {
        let candidate;
        if (availableStudents.length > 1) {
          do {
            candidate = availableStudents[Math.floor(Math.random() * availableStudents.length)];
          } while (candidate === lastStudent);
        } else {
          candidate = availableStudents[0];
        }
        reelSequence.push(candidate);
        lastStudent = candidate;
      }
      // L'ultimo elemento della sequenza è esattamente il vincitore
      reelSequence.push(currentWinner);

      // Renderizza la lista nella Slot Reel
      slotReel.innerHTML = '';
      slotReel.style.transition = 'none';
      slotReel.style.transform = 'translateY(0px)';

      reelSequence.forEach(name => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'slot-item';
        itemDiv.textContent = name;
        slotReel.appendChild(itemDiv);
      });

      // Animazione di scorrimento fisicamente bilanciata a 15 Secondi (15000 ms)
      const targetY = -(totalTicks - 1) * itemHeight + 80; // Allinea al centro della finestra (220px / 2 - 30px = 80px)
      const duration = 15000;

      // Applica la transizione cubic-bezier per accelerazione iniziale e lento arresto finale
      slotReel.style.transition = `transform ${duration}ms cubic-bezier(0.15, 0.85, 0.35, 1)`;
      
      requestAnimationFrame(() => {
        slotReel.style.transform = `translateY(${targetY}px)`;
      });

      // Riproduce l'effetto sonoro durante lo scorrimento
      let tickInterval = setInterval(() => {
        playTickSound();
      }, 150);

      setTimeout(() => {
        clearInterval(tickInterval);
        isSpinning = false;
        playWinSound();
        showWinnerModal(currentWinner);

        // Aggiorna elenchi
        drawnStudents.push(currentWinner);
        availableStudents = availableStudents.filter(s => s !== currentWinner);
        updateStats();
      }, duration);
    }

    function showWinnerModal(name) {
      winnerNameDisplay.textContent = name;
      winnerModal.classList.add('active');
    }

    // --- EVENT LISTENERS ---
    spinBtn.addEventListener('click', startSpin);

    classSelect.addEventListener('change', (e) => {
      loadClassData(e.target.value);
    });

    btnCloseModal.addEventListener('click', () => {
      winnerModal.classList.remove('active');
    });

    btnMarkAbsent.addEventListener('click', () => {
      winnerModal.classList.remove('active');
      // Rimuovi anche da estratti
      drawnStudents = drawnStudents.filter(s => s !== currentWinner);
      updateStats();
    });

    btnResetAbsents.addEventListener('click', () => {
      loadClassData(currentClassName);
    });

    // Modale Scrittura Diretta
    btnManualInput.addEventListener('click', () => {
      newClassName.value = currentClassName;
      rawNamesTextarea.value = (classesData[currentClassName] || []).join('\n');
      inputModal.classList.add('active');
    });

    btnCloseInputModal.addEventListener('click', () => {
      inputModal.classList.remove('active');
    });

    btnSaveClass.addEventListener('click', () => {
      const cName = newClassName.value.trim() || "Nuova Classe";
      const names = rawNamesTextarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);

      classesData[cName] = names;
      localStorage.setItem('teacher_classes', JSON.stringify(classesData));
      currentClassName = cName;
      renderClassOptions();
      loadClassData(cName);
      inputModal.classList.remove('active');
    });

    // Caricamento File .TXT
    btnLoadFile.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const names = event.target.result
          .split(/\r?\n/)
          .map(n => n.trim())
          .filter(n => n.length > 0);

        const cName = file.name.replace('.txt', '');
        classesData[cName] = names;
        localStorage.setItem('teacher_classes', JSON.stringify(classesData));
        currentClassName = cName;
        renderClassOptions();
        loadClassData(cName);
      };
      reader.readAsText(file);
    });

    // Toggle Audio
    audioToggleBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      document.getElementById('audioStatus').textContent = audioEnabled ? 'Audio On' : 'Audio Off';
      document.getElementById('audioIcon').textContent = audioEnabled ? '🔊' : '🔇';
    });

    init();
  </script>
</body>
</html>
