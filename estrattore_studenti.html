<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estrattore Studenti</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0b132b 0%, #1c2541 50%, #0b132b 100%);
      --card-bg: rgba(28, 37, 65, 0.75);
      --card-border: rgba(0, 180, 216, 0.25);
      --primary-blue: #0077b6;
      --accent-cyan: #00b4d8;
      --text-main: #f8f9fa;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 900px;
      position: relative;
    }

    .audio-toggle {
      position: absolute;
      right: 0;
      top: 0;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .audio-toggle:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, #90e0ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-top: 5px;
    }

    main {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .class-selector-group {
      margin-bottom: 15px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      display: block;
      margin-bottom: 8px;
    }

    select, input, textarea {
      width: 100%;
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(144, 224, 239, 0.3);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--accent-cyan);
    }

    .btn-group-vertical {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }

    .btn {
      background: var(--primary-blue);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #0096c7;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.4);
    }

    .stats {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--card-border);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Slot Machine Frame */
    .slot-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .slot-window {
      width: 100%;
      height: 220px;
      background: #070a14;
      border: 3px solid var(--accent-cyan);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 25px rgba(0, 180, 216, 0.2);
    }

    .slot-window::before, .slot-window::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 2;
      pointer-events: none;
    }

    .slot-window::before {
      top: 0;
      background: linear-gradient(to bottom, #070a14 0%, rgba(7, 10, 20, 0) 100%);
    }

    .slot-window::after {
      bottom: 0;
      background: linear-gradient(to top, #070a14 0%, rgba(7, 10, 20, 0) 100%);
    }

    .slot-target-line {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 60px;
      transform: translateY(-50%);
      border-top: 2px solid rgba(144, 224, 239, 0.4);
      border-bottom: 2px solid rgba(144, 224, 239, 0.4);
      background: rgba(0, 180, 216, 0.1);
      z-index: 1;
      pointer-events: none;
    }

    .slot-reel {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      will-change: transform;
    }

    .slot-item {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #e2e8f0;
      width: 100%;
      text-align: center;
      padding: 0 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spin-btn {
      margin-top: 25px;
      width: 100%;
      padding: 16px;
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(90deg, #0077b6, #00b4d8);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 180, 216, 0.4);
      transition: all 0.2s;
    }

    .spin-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 180, 216, 0.6);
    }

    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 10, 20, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: #1c2541;
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 450px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transform: scale(0.9);
      transition: transform 0.3s;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .winner-title {
      color: var(--accent-cyan);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .winner-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 20px;
      word-break: break-word;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <button class="audio-toggle" id="audioToggleBtn">
      <span id="audioIcon">🔊</span> <span id="audioStatus">Audio On</span>
    </button>
    <h1>Estrattore Studenti</h1>
    <div class="subtitle">Strumento per l'estrazione casuale nelle lezioni</div>
  </header>

  <main>
    <div class="panel">
      <div class="class-selector-group">
        <label for="classSelect">Classe Attiva</label>
        <select id="classSelect"></select>
      </div>

      <div class="btn-group-vertical">
        <button class="btn btn-secondary" id="btnManualInput">✏️ Inserisci / Modifica Nomi</button>
        <button class="btn btn-secondary" id="btnLoadFile">📁 Carica File .TXT</button>
        <input type="file" id="fileInput" accept=".txt" style="display: none;">
        <button class="btn btn-danger" id="btnResetAbsents">🔄 Ripristina Esclusi</button>
      </div>

      <div class="stats">
        <span>Disponibili: <strong id="countAvailable">0</strong></span>
        <span>Estratti: <strong id="countDrawn">0</strong></span>
      </div>
    </div>

    <div class="panel slot-stage">
      <div class="slot-window">
        <div class="slot-target-line"></div>
        <div class="slot-reel" id="slotReel">
          <div class="slot-item">Pronto</div>
        </div>
      </div>
      <button class="spin-btn" id="spinBtn">AVVIA ESTRAZIONE (15s)</button>
    </div>
  </main>

  <footer>
    Sviluppato per la Didattica | <span id="teacherInfo">Docente</span>
  </footer>

  <!-- Modal Esito Estrazione -->
  <div class="modal-overlay" id="winnerModal">
    <div class="modal-card">
      <div class="winner-title">Studente Estratto</div>
      <div class="winner-name" id="winnerNameDisplay">-</div>
      <div class="modal-actions">
        <button class="btn btn-danger" id="btnMarkAbsent">Segna Assente</button>
        <button class="btn" id="btnCloseModal">OK</button>
      </div>
    </div>
  </div>

  <!-- Modal Gestione Nomi -->
  <div class="modal-overlay" id="inputModal">
    <div class="modal-card" style="max-width: 500px;">
      <div class="winner-title" style="text-align: left;">Gestione Elenco Studenti</div>
      <div style="margin-bottom: 12px; text-align: left;">
        <label for="newClassName">Nome Classe</label>
        <input type="text" id="newClassName" placeholder="es. 3A Informatica">
      </div>
      <div style="margin-bottom: 15px; text-align: left;">
        <label for="rawNamesTextarea">Nomi (uno per riga)</label>
        <textarea id="rawNamesTextarea" rows="8" placeholder="Mario Rossi&#10;Luigi Verdi&#10;Anna Bianchi"></textarea>
      </div>
      <div class="modal-actions" style="justify-content: flex-end;">
        <button class="btn btn-secondary" id="btnCloseInputModal">Annulla</button>
        <button class="btn" id="btnSaveClass">Salva Classe</button>
      </div>
    </div>
  </div>

  <script>
    // DATI E STATO
    let classesData = JSON.parse(localStorage.getItem('teacher_classes')) || {
      "Classe Esempio": ["Mario Rossi", "Luigi Verdi", "Anna Bianchi", "Giuseppe Garibaldi", "Elena Cornaro", "Galileo Galilei"]
    };
    let currentClassName = localStorage.getItem('teacher_active_class') || Object.keys(classesData)[0];
    let availableStudents = [];
    let drawnStudents = [];
    let currentWinner = null;
    let isSpinning = false;
    let audioEnabled = true;

    // AUDIO SYSTEM (Solo Tic)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTickSound() {
      if (!audioEnabled) return;
      if (!audioCtx) audioCtx = new AudioContext();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.02);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.02);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.02);
    }

    // ELEMENTI DOM
    const classSelect = document.getElementById('classSelect');
    const countAvailable = document.getElementById('countAvailable');
    const countDrawn = document.getElementById('countDrawn');
    const slotReel = document.getElementById('slotReel');
    const spinBtn = document.getElementById('spinBtn');
    const winnerModal = document.getElementById('winnerModal');
    const winnerNameDisplay = document.getElementById('winnerNameDisplay');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const btnMarkAbsent = document.getElementById('btnMarkAbsent');
    const inputModal = document.getElementById('inputModal');
    const btnManualInput = document.getElementById('btnManualInput');
    const btnCloseInputModal = document.getElementById('btnCloseInputModal');
    const btnSaveClass = document.getElementById('btnSaveClass');
    const newClassName = document.getElementById('newClassName');
    const rawNamesTextarea = document.getElementById('rawNamesTextarea');
    const btnLoadFile = document.getElementById('btnLoadFile');
    const fileInput = document.getElementById('fileInput');
    const btnResetAbsents = document.getElementById('btnResetAbsents');
    const audioToggleBtn = document.getElementById('audioToggleBtn');

    function init() {
      renderClassOptions();
      loadClassData(currentClassName);
    }

    function renderClassOptions() {
      classSelect.innerHTML = '';
      Object.keys(classesData).forEach(cName => {
        const opt = document.createElement('option');
        opt.value = cName;
        opt.textContent = cName;
        if (cName === currentClassName) opt.selected = true;
        classSelect.appendChild(opt);
      });
    }

    function loadClassData(className) {
      currentClassName = className;
      localStorage.setItem('teacher_active_class', className);
      availableStudents = [...(classesData[className] || [])];
      drawnStudents = [];
      updateStats();
      resetReelUI();
    }

    function updateStats() {
      countAvailable.textContent = availableStudents.length;
      countDrawn.textContent = drawnStudents.length;
      spinBtn.disabled = availableStudents.length === 0 || isSpinning;
    }

    function resetReelUI() {
      slotReel.style.transition = 'none';
      slotReel.style.transform = 'translateY(0px)';
      if (availableStudents.length > 0) {
        slotReel.innerHTML = `<div class="slot-item">${availableStudents[0]}</div>`;
      } else {
        slotReel.innerHTML = `<div class="slot-item">Nessuno studente</div>`;
      }
    }

    // ANIMAZIONE ANIMATA (PARTE LENTA -> ACCELERA -> DECELEVA E SI FERMA SUL VINCITORE)
    function startSpin() {
      if (availableStudents.length === 0 || isSpinning) return;
      isSpinning = true;
      spinBtn.disabled = true;

      const winnerIndex = Math.floor(Math.random() * availableStudents.length);
      currentWinner = availableStudents[winnerIndex];

      const itemHeight = 60;
      const targetWindowOffset = 80; // posiziona al centro della finestra 220px
      const totalSteps = 120; 

      // Generazione sequenza circolare continua
      const reelSequence = [];
      let studentPool = [...availableStudents];
      let lastPicked = "";

      for (let i = 0; i < totalSteps - 2; i++) {
        let candidate;
        if (studentPool.length > 1) {
          do {
            candidate = studentPool[Math.floor(Math.random() * studentPool.length)];
          } while (candidate === lastPicked);
        } else {
          candidate = studentPool[0];
        }
        reelSequence.push(candidate);
        lastPicked = candidate;
      }
      
      // Gli ultimi elementi garantiscono la continuazione visiva dopo il vincitore
      reelSequence.push(currentWinner);
      const nextStudentAfterWinner = studentPool[(winnerIndex + 1) % studentPool.length] || currentWinner;
      const secondNextStudent = studentPool[(winnerIndex + 2) % studentPool.length] || currentWinner;
      reelSequence.push(nextStudentAfterWinner);
      reelSequence.push(secondNextStudent);

      // Renderizza elementi
      slotReel.innerHTML = '';
      reelSequence.forEach(name => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'slot-item';
        itemDiv.textContent = name;
        slotReel.appendChild(itemDiv);
      });

      const winnerPosIndex = totalSteps - 2;
      const targetY = -(winnerPosIndex * itemHeight) + targetWindowOffset;
      const duration = 15000; // 15 secondi esatti

      let startTime = null;
      let lastItemIndex = -1;

      // Curva custom: parte lenta, accelera a metà, decelera e si ferma con precisione
      function customEase(t) {
        if (t < 0.3) {
          // Accelerazione iniziale graduale
          return (Math.pow(t / 0.3, 2) * 0.2);
        } else if (t < 0.7) {
          // Fase ad alta velocità
          const subT = (t - 0.3) / 0.4;
          return 0.2 + subT * 0.55;
        } else {
          // Decelerazione finale uniforme fino all'arresto
          const subT = (t - 0.7) / 0.3;
          return 0.75 + (1 - Math.pow(1 - subT, 3)) * 0.25;
        }
      }

      function animateSlot(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easedProgress = customEase(progress);

        const currentY = easedProgress * targetY;
        slotReel.style.transform = `translateY(${currentY}px)`;

        // Calcola quale elemento sta passando al centro per riprodurre il TIC
        const currentPassedIndex = Math.floor(Math.abs(currentY) / itemHeight);
        if (currentPassedIndex !== lastItemIndex) {
          playTickSound();
          lastItemIndex = currentPassedIndex;
        }

        if (progress < 1) {
          requestAnimationFrame(animateSlot);
        } else {
          // Fine animazione
          isSpinning = false;
          showWinnerModal(currentWinner);
          drawnStudents.push(currentWinner);
          availableStudents = availableStudents.filter(s => s !== currentWinner);
          updateStats();
        }
      }

      requestAnimationFrame(animateSlot);
    }

    function showWinnerModal(name) {
      winnerNameDisplay.textContent = name;
      winnerModal.classList.add('active');
    }

    // GESTIONE EVENTI
    spinBtn.addEventListener('click', startSpin);

    classSelect.addEventListener('change', (e) => {
      loadClassData(e.target.value);
    });

    btnCloseModal.addEventListener('click', () => {
      winnerModal.classList.remove('active');
    });

    btnMarkAbsent.addEventListener('click', () => {
      winnerModal.classList.remove('active');
      drawnStudents = drawnStudents.filter(s => s !== currentWinner);
      updateStats();
    });

    btnResetAbsents.addEventListener('click', () => {
      loadClassData(currentClassName);
    });

    btnManualInput.addEventListener('click', () => {
      newClassName.value = currentClassName;
      rawNamesTextarea.value = (classesData[currentClassName] || []).join('\n');
      inputModal.classList.add('active');
    });

    btnCloseInputModal.addEventListener('click', () => {
      inputModal.classList.remove('active');
    });

    btnSaveClass.addEventListener('click', () => {
      const cName = newClassName.value.trim() || "Nuova Classe";
      const names = rawNamesTextarea.value
        .split('\n')
        .map(n => n.trim())
        .filter(n => n.length > 0);

      classesData[cName] = names;
      localStorage.setItem('teacher_classes', JSON.stringify(classesData));
      currentClassName = cName;
      renderClassOptions();
      loadClassData(cName);
      inputModal.classList.remove('active');
    });

    btnLoadFile.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const names = event.target.result
          .split(/\r?\n/)
          .map(n => n.trim())
          .filter(n => n.length > 0);

        const cName = file.name.replace('.txt', '');
        classesData[cName] = names;
        localStorage.setItem('teacher_classes', JSON.stringify(classesData));
        currentClassName = cName;
        renderClassOptions();
        loadClassData(cName);
      };
      reader.readAsText(file);
    });

    audioToggleBtn.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      document.getElementById('audioStatus').textContent = audioEnabled ? 'Audio On' : 'Audio Off';
      document.getElementById('audioIcon').textContent = audioEnabled ? '🔊' : '🔇';
    });

    init();
  </script>
</body>
</html>
